<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Ruleta Sorteo</title>
<style>
    body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 30px;
        background: #fafafa;
    }

    #wheel {
        width: 400px;
        height: 400px;
        border-radius: 50%;
        border: 8px solid #333;
        position: relative;
        overflow: hidden;
        transition: transform 4s cubic-bezier(.17,.67,.3,1.3);
    }

    .slice {
        position: absolute;
        width: 50%;
        height: 50%;
        left: 50%;
        top: 50%;
        transform-origin: 0% 0%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        text-shadow: 1px 1px 2px black;
    }

    #indicator {
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-bottom: 30px solid red;
        margin-top: -10px;
    }

    #controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    #winnerBox {
        margin-top: 30px;
        font-size: 1.5em;
        font-weight: bold;
        opacity: 0;
        transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        transform: scale(0.8);
    }

    #winnerBox.show {
        opacity: 1;
        transform: scale(1.2);
    }
</style>
</head>
<body>
<h1>Ruleta de Sorteo</h1>

<div id="indicator"></div>
<div id="wheel"></div>

<div id="controls">
    <input id="reason" type="text" placeholder="Motivo del sorteo (opcional)" />
    <button id="btnSpin">Sortear</button>
</div>

<div id="winnerBox"></div>

<script>
const names = [
    "Héctor",
    "Javi",
    "Nacho",
    "Beni",
    "Alberto",
    "Andrés",
    "Pablo",
    "Carlos M.",
    "Carlos O.",
    "Mica"
];

const colors = [
    "#e74c3c",
    "#3498db",
    "#f1c40f",
    "#2ecc71",
    "#9b59b6",
    "#e67e22",
    "#1abc9c",
    "#34495e",
    "#e84393",
    "#16a085"
];

const wheel = document.getElementById("wheel");
const winnerBox = document.getElementById("winnerBox");

// --- Construcción dinámica de la ruleta ---
const sliceAngle = 360 / names.length;

names.forEach((name, i) => {
    const slice = document.createElement("div");
    slice.className = "slice";

    slice.style.background = colors[i];
    slice.style.transform = `rotate(${sliceAngle * i}deg) skewY(${90 - sliceAngle}deg)`;

    slice.innerHTML = `
        <div style="
            transform: skewY(${-(90 - sliceAngle)}deg) rotate(${sliceAngle / 2}deg);
            width: 150%;
            text-align: left;
            padding-left: 20px;
        ">
            ${name}
        </div>
    `;

    wheel.appendChild(slice);
});

// --- Lógica del sorteo ---
document.getElementById("btnSpin").onclick = () => {
    const reason = document.getElementById("reason").value || "el sorteo";
    winnerBox.classList.remove("show");
    winnerBox.innerHTML = "";

    const randomIndex = Math.floor(Math.random() * names.length);
    const winner = names[randomIndex];

    // Rotación aleatoria + ángulo necesario para que el ganador quede arriba
    const finalAngle = 360 * 8 + (360 - (randomIndex * sliceAngle + sliceAngle / 2));

    wheel.style.transform = `rotate(${finalAngle}deg)`;

    setTimeout(() => {
        winnerBox.innerHTML = `🎉 El ganador de <b>${reason}</b> es <span style="color:#e74c3c">${winner}</span> 🎉`;
        winnerBox.classList.add("show");
    }, 4000);
};
</script>

</body>
</html>

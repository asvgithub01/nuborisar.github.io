<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendario de Adviento</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #DB0007;
      margin: 0;
      overflow: hidden;
    }

    /* Contenedor general del árbol */
    .calendar {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      max-width: 400px;
      margin: 0 auto;
      gap: 8px;
    }

    /* Cada fila del árbol */
    .tree-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .day {
      aspect-ratio: 1 / 1;
      width: 50px;
      background: #ccc;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      cursor: pointer;
      border-radius: 10px;
      font-size: 1.8em;
      padding: 5px 10px;
      user-select: none;
      background-image: url('juego/fondodias.jpg');
      background-size: cover;
      position: relative;
      color: white;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .day.locked {
      background: #eee;
      color: #aaa;
      cursor: not-allowed;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transform: scale(1.05);
      transition: 0.2s ease;
    }
    .day.flip {
      animation: flipOut 0.6s forwards;
      transform-style: preserve-3d;
    }

    @keyframes flipOut {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(90deg);
      }
    }

   #scratchScreen {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #DB0007;
      z-index: 10;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      margin: 0 auto;
      width: 300px; height: 300px;
      background-size: cover;
      touch-action: none;
    }

    .prize {
      margin-top: 20px;
      color: white;
      font-size: 1.2em;
    }

    .back-button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 1em;
      background-color: white;
      color: #DB0007;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (orientation: portrait) and (max-width: 768px) {
      .calendar {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (orientation: landscape) and (max-width: 768px) {
      .calendar {
        grid-template-columns: repeat(4, 1fr);
      }
    }
	 .snowflake {
      position: fixed;
      top: -50px;
      width: 30px;
      height: 30px;
       /*background-image: url('juego/copo1.png');   */
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 5;
      animation: fall linear infinite;
    }
	 @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
    @media (min-width: 769px) {
      body {
        transform: rotate(0deg);
      }
      @media (orientation: portrait) {
        body::before {
          content: "Por favor gira tu dispositivo";
          display: block;
          font-size: 2em;
          padding: 2em;
        }
        .calendar, #scratchScreen { display: none !important; }
      }
    }
  </style>
</head>
<body>
  <h1>Juego: <span id="gameId">Cargando...</span></h1>
  <div class="calendar" id="calendar"></div>

  <div id="scratchScreen">
    <canvas id="scratchCanvas" width="300" height="300"></canvas>
    <div class="prize" id="prizeImage"></div>
    <button id="backButton" class="back-button" style="display:none;">Volver al calendario</button>

	<!-- Texto de carga -->
  <div id="loading">⌛ Pensando...</div>
  <!-- Resultado de la comunicación nativa -->
  <div id="output">Esperando datos desde nativo</div>
  </div>

  <script>
    const calendar = document.getElementById('calendar');
	const scratchScreen = document.getElementById('scratchScreen');
    const scratchCanvas = document.getElementById('scratchCanvas');
    const prizeImage = document.getElementById('prizeImage');
    const backButton = document.getElementById('backButton');
    const ctx = scratchCanvas.getContext('2d');
    const width = scratchCanvas.width;
    const height = scratchCanvas.height;
    const totalPixels = width * height;
    const revealThreshold = 0.40;
	const NoPrizeText="Sigue Buscando";
	const PrizeText="Ganaste";
	const NoPrizeImg="url('juego/siguebuscando.png')";
	const PrizeImg="url('juego/premio.png')";
	const copo1="url('juego/copo1.png')";
	const copo2="url('juego/copo2.png')";

	var textPrize="Sigue Buscando";
    const today = new Date().getDate();
    const totalDays = 24;

    
    const rows = [1, 2, 3, 4, 5, 6, 3]; // totla 24

    let dayCounter = 1;
    for(let r = 0; r < rows.length; r++) {
      const rowDiv = document.createElement('div');
      rowDiv.classList.add('tree-row');

      for(let c = 0; c < rows[r]; c++) {
        if(dayCounter > totalDays) break;
        const day = document.createElement('div');
        day.classList.add('day');
        day.textContent = dayCounter;
        if(dayCounter > today) {
          day.classList.add('locked');
        } else {
           //pa q haga la animacion
          day.addEventListener('click', (e) => {
            const el = e.currentTarget;
            el.classList.add('flip');
            setTimeout(() => {
              el.classList.remove('flip');
              openScratchScreen(dayCounter);
            }, 600);
          });
        }
        rowDiv.appendChild(day);
        dayCounter++;
      }
      calendar.appendChild(rowDiv);
    }

     
    function openScratchScreen(day) {
      scratchScreen.style.display = 'flex';
      prizeImage.innerHTML = '';
      backButton.style.display = 'none';

      
      const fondo = Math.random() > 0.5 ? PrizeImg : NoPrizeImg;
      scratchCanvas.style.backgroundImage = fondo;
	  if(fondo==PrizeImg)
		textPrize = PrizeText;
	  else
		textPrize = NoPrizeText;

      // Rellenar gris para rascar
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#999';
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'destination-out';

      scratchCanvas.addEventListener('mousedown', startScratch);
      scratchCanvas.addEventListener('touchstart', startScratch);
    }

    function startScratch(e) {
      e.preventDefault();
      const rect = scratchCanvas.getBoundingClientRect();

      function move(evt) {
        const x = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
        const y = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();
        checkScratchProgress();
      }

      function stop() {
        scratchCanvas.removeEventListener('mousemove', move);
        scratchCanvas.removeEventListener('touchmove', move);
        document.removeEventListener('mouseup', stop);
        document.removeEventListener('touchend', stop);
      }

      scratchCanvas.addEventListener('mousemove', move);
      scratchCanvas.addEventListener('touchmove', move);
      document.addEventListener('mouseup', stop);
      document.addEventListener('touchend', stop);
    }

    function checkScratchProgress() {
      const pixels = ctx.getImageData(0, 0, width, height).data;
      let transparent = 0;
      for (let i = 3; i < pixels.length; i += 4) {
        if (pixels[i] === 0) transparent++;
      }
      const percent = transparent / totalPixels;

      if (percent > revealThreshold) {
        revealPrize();
      }
    }

    function revealPrize() {
	sendScore(textPrize);
      //   premio o nada
      prizeImage.innerHTML = '<p>¡'+ textPrize+'!</p>';
      backButton.style.display = 'inline-block';
      backButton.onclick = () => {
        scratchScreen.style.display = 'none';
      };
    }
	 // Nieve animada
    function createSnowflake() {
      const snowflake = document.createElement('div');
	  const fondo = Math.random() > 0.5 ? copo1 : copo2;
      snowflake.style.backgroundImage = fondo;
      snowflake.classList.add('snowflake');
      const size = Math.random() * 20 + 10;
      snowflake.style.width = size + 'px';
      snowflake.style.height = size + 'px';
      snowflake.style.left = Math.random() * window.innerWidth + 'px';
      snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
      document.body.appendChild(snowflake);
      setTimeout(() => snowflake.remove(), 10000);
    }

    setInterval(createSnowflake, 300);

	/*JSBridge*/
	
    // Variables globales para el estado del juego
    let currentGameId = null;
    let currentPayload = {};
    let lastScoreSent = null;

    // Función que se ejecuta al pulsar un botón de puntuación
    function sendScore(score) {
      // Validación básica: ¿hay bridge y gameId?
      if (!window.kmpJsBridge || !currentGameId) {
        alert("Bridge o GameId no disponible");
        return;
      }

      lastScoreSent = score;

      // Mostrar indicador de carga
      document.getElementById("loading").style.display = "block";

      // Crear el mensaje que se enviará al bridge nativo
      const message = {
        gameId: currentGameId,
        userId: currentPayload.mcid || "unknown",
        score: score.toString()
      };

      // Comunicación JS → Native con callback para respuesta
      window.kmpJsBridge.callNative(
        "GameBridge", // Nombre del handler registrado en Kotlin
        JSON.stringify(message), // Datos enviados
        onCallback = function(response) { // Callback cuando Native responde
          // ⏳ Espera mínima para que el loading se vea
          setTimeout(() => {
            document.getElementById("loading").style.display = "none";
            try {
              // Interpretar respuesta como JSON
              const data = JSON.parse(response);
              // Mostrar respuesta
              document.getElementById("output").innerText =
                "📲 Respuesta:\n" + JSON.stringify(data, null, 2);
              console.log("📲 Respuesta de Android:", data);

              // Destacar el botón pulsado
              highlightButton(score);
            } catch (e) {
              console.error("❌ Error al parsear respuesta:", e);
              document.getElementById("output").innerText = "❌ Error en respuesta.";
            }
          }, 2000); // <-- retardo artificial para ver el loading
        }
      );
    }

    // Destaca el botón pulsado y oculta los demás
    function highlightButton(score) {
      const buttons = document.querySelectorAll("#scoreButtons button");
      buttons.forEach((btn) => {
        const btnScore = parseInt(btn.innerText);
        if (btnScore === score) {
          btn.classList.add("active");
        } else {
          btn.style.display = "none"; // Oculta los no pulsados
        }
      });
    }

    // Esta función la llama Kotlin/Native al cargar
    window.receiveDataFromKMP = function(parsed) {
      currentGameId = parsed.gameId;
      currentPayload = parsed.payload || {};

      // Mostrar datos recibidos y activar los botones
      document.getElementById("gameId").innerText = currentGameId;
      document.getElementById("scoreButtons").style.display = "block";
      document.getElementById("output").innerText =
        "🎮 Datos recibidos:\n" + JSON.stringify(parsed, null, 2);

      console.log("🎮 Datos recibidos desde Android:", parsed);
    };
  
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JS Bridge Test</title>
</head>
<body>
<h1>JS ↔ Kotlin</h1>
<p>ID del juego: <span id="gameId">sin datos</span></p>
<p>Action recibido: <span id="inAction">sin datos</span></p>
<p>Action enviado: <span id="outAction">sin datos</span></p>

<button onclick="startGame()">Start Juego</button>
<button onclick="endGame()">Juego Terminado</button>

<pre id="output">Esperando datos desde nativo...</pre>

<script>

    let currentGameId = null;
    let currentPayload = {};

    function startGame() {
      if (!window.kmpJsBridge) {
        alert("Bridge no disponible");
        return;
      }
      const message = {
        action: "startGame_from_JS",
        gameId: "demo",

      };
        document.getElementById("outAction").innerText =message.action;
      window.kmpJsBridge.callNative(
        "GameBridge",
        JSON.stringify(message),
        function (response) {
          document.getElementById("output").innerText =
            "Respuesta desde nativo:\n" + response;
        }
      );
    }

    function endGame() {
      if (!window.kmpJsBridge) {
        alert("Bridge no disponible");
        return;
      }
      const message = {
        action: "endGame_from_JS",
        gameId: "demo"
      };
      document.getElementById("outAction").innerText =message.action;
      window.kmpJsBridge.callNative(
        "GameBridge",
        JSON.stringify(message),
        function (response) {
          document.getElementById("output").innerText =
            "Respuesta desde nativo:\n" + response;
        }
      );
    }

     function closeGame() {
      if (!window.kmpJsBridge) {
        alert("Bridge no disponible");
        return;
      }
      const message = {
        action: "closeGame_from_JS",
        gameId:  "demo"
      };
      document.getElementById("outAction").innerText = message.action;
      window.kmpJsBridge.callNative(
        "GameBridge",
        JSON.stringify(message),
        function (response) {
          document.getElementById("output").innerText =
            "Respuesta desde nativo del closegame:\n" + response;
        }
      );
    }

    // Esta función la invoca Kotlin
    window.receiveDataFromKMP = function (data) {

     document.getElementById("inAction").innerText = data.action;

      if (data.action === "claimGame_from_KT") {
        alert("¡Claim recibido! \n"+data.score);
        closeGame();
        return;
      }
      document.getElementById("output").innerText =
        "Datos recibidos desde Kotlin:\n" + JSON.stringify(data, null, 2);
    };
</script>
</body>
</html>

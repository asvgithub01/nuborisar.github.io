<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>JS Bridge Test</title>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    button { margin: 8px; padding: 8px 16px; }
    pre { background: #eee; padding: 10px; border-radius: 6px; }

    #codeBox {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #f4f4f4;
      border: 2px dashed #888;
      border-radius: 8px;
      text-align: center;
    }

    #claimCode {
      font-weight: bold;
      font-size: 1.4em;
      margin-bottom: 8px;
      display: block;
    }

    #copyBtn {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
    }

    #copyBtn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
<h1>JS ↔ Kotlin Bridge</h1>

<p><strong>ID del juego:</strong> <span id="gameId">sin datos</span></p>
<p><strong>Action recibido:</strong> <span id="inAction">sin datos</span></p>
<p><strong>Action enviado:</strong> <span id="outAction">sin datos</span></p>

<button onclick="startGame()">Start Juego</button>
<button onclick="endGame()">Juego Terminado</button>

<pre id="output">Esperando datos desde nativo...</pre>

<div id="codeBox">
  <span id="claimCode"></span>
  <button id="copyBtn" onclick="copyCodeToClipboard()">Copiar código</button>
</div>

<hr>
<a href="arcosmobile://games">Catálogo de juegos</a><br>
<a href="arcosmobile://games?id=68c1504d476236f381690c01">Calendario Navidad</a><br>
<a href="arcosmobile://games?id=68e685e76f8af3513b594de5">Pablo juego</a>

<script>
  // --- Estado ---
  let currentGameId = "demo";
  let currentClaimCode = null;

  // --- Funciones de envío hacia KMP ---
  function startGame() {
    if (!window.kmpJsBridge) {
      alert("Bridge no disponible");
      return;
    }

    const message = {
      action: "startGame_from_JS",
      gameId: currentGameId,
      userId: "user123",
      score: "",
      claimResponse: null,
      startResponse: null,
      startData: null
    };

    document.getElementById("outAction").innerText = message.action;

    window.kmpJsBridge.callNative(
      "GameBridge",
      JSON.stringify(message),
      function (response) {
        document.getElementById("output").innerText =
          "Respuesta desde nativo (startGame):\n" + response;
      }
    );
  }

  function endGame() {
    if (!window.kmpJsBridge) {
      alert("Bridge no disponible");
      return;
    }

    const message = {
      action: "endGame_from_JS",
      gameId: currentGameId,
      userId: "user123",
      score: "500",
      claimResponse: null,
      startResponse: null,
      startData: null
    };

    document.getElementById("outAction").innerText = message.action;

    window.kmpJsBridge.callNative(
      "GameBridge",
      JSON.stringify(message),
      function (response) {
        document.getElementById("output").innerText =
          "Respuesta desde nativo (endGame):\n" + response;
      }
    );
  }

  function closeGame() {
    if (!window.kmpJsBridge) {
      alert("Bridge no disponible");
      return;
    }

    const message = {
      action: "closeGame_from_JS",
      gameId: currentGameId
    };

    document.getElementById("outAction").innerText = message.action;

    window.kmpJsBridge.callNative(
      "GameBridge",
      JSON.stringify(message),
      function (response) {
        document.getElementById("output").innerText =
          "Respuesta desde nativo (closeGame):\n" + response;
      }
    );
  }

  // --- Copiar código al portapapeles ---
  function copyCodeToClipboard() {
    if (!currentClaimCode) return;

    navigator.clipboard.writeText(currentClaimCode)
      .then(() => {
        alert("📋 Código copiado al portapapeles: " + currentClaimCode);
        sendCopyAction();
      })
      .catch(() => {
        alert("Error copiando el código");
      });
  }

  // --- Enviar acción "copyGame_from_JS" ---
  function sendCopyAction() {
    if (!window.kmpJsBridge) {
      console.warn("Bridge no disponible para copyGame_from_JS");
      return;
    }

    const message = {
      action: "copyGame_from_JS",
      gameId: currentGameId,
      code: currentClaimCode
    };

    document.getElementById("outAction").innerText = message.action;

    window.kmpJsBridge.callNative("GameBridge", JSON.stringify(message), function (response) {
      console.log("📤 Acción copyGame_from_JS enviada. Respuesta:", response);
    });
  }

  // --- Función que invoca Kotlin ---
  window.receiveDataFromKMP = function (data) {
    let parsed;
    try {
      parsed = typeof data === "string" ? JSON.parse(data) : data;
    } catch (e) {
      console.error("Error parseando JSON recibido:", e, data);
      alert("Error parseando datos desde Kotlin");
      return;
    }

    document.getElementById("inAction").innerText = parsed.action || "(sin acción)";
    document.getElementById("gameId").innerText = parsed.gameId || "(sin id)";

    console.log("📩 Datos recibidos desde Kotlin:", parsed);
    document.getElementById("output").innerText =
      "Datos recibidos desde Kotlin:\n" + JSON.stringify(parsed, null, 2);

    // --- Lógica de acciones según tipo ---
    if (parsed.action === "claimGame_from_KT") {
      const claim = parsed.claimResponse || {};
      const win = claim.winner ? "GANADOR" : "NO GANADOR";
      const code = claim.code ? `\nCódigo: ${claim.code}` : "";
      const points = claim.loyaltyPoints != null ? `\nPuntos: ${claim.loyaltyPoints}` : "";
      const extra = (!claim.code && claim.loyaltyPoints == null) ? "\n(Sin premio ni puntos)" : "";

      alert(`🎯 Claim recibido\nResultado: ${win}${code}${points}${extra}`);

      // Mostrar el código si existe
      if (claim.code) {
        currentClaimCode = claim.code;
        document.getElementById("claimCode").innerText = claim.code;
        document.getElementById("codeBox").style.display = "block";
      }

      closeGame();
    }

    if (parsed.action === "startGame_from_KT") {
      let msg = "🏁 Histórico de premios:\n" +
        JSON.stringify(parsed.startResponse, null, 2);

      if (parsed.startData && parsed.startData.length > 0) {
        msg += "\n\n⚙️ Configuración recibida:\n";
        parsed.startData.forEach((item, index) => {
          msg += `#${index + 1} → Label: ${item.label || "-"}, Value: ${item.value || "-"}, Type: ${item.type || "-"}\n`;
        });
      }

      alert(msg);
    }
  };
</script>
</body>
</html>
